# Model Configuration for PT-BR to LIBRAS Translation

# Base model selection
model:
  name: "google/mt5-small"  # Changed from base to small for CPU stability
  tokenizer: "google/mt5-small"
  max_sequence_length: 128
  architecture: "syntax_aware"  # Options: baseline, syntax_aware
  
  # Model dimensions
  hidden_size: 768  # mt5-base default
  num_layers: 12
  num_heads: 12
  
  # Syntax embedding configuration
  syntax:
    enabled: true
    num_tags: 50  # Number of Portuguese dependency tags
    embedding_dim: 768  # Same as hidden_size
    normalization: "l2"  # L2 normalization before combining
    combination_method: "sum"  # Options: sum, concat, attention
  
  # Sequence lengths
  max_source_length: 128
  max_target_length: 128
  
  # Special tokens
  special_tokens:
    pad_token: "<pad>"
    bos_token: "<s>"
    eos_token: "</s>"
    unk_token: "<unk>"
    # Language-specific tokens
    pt_token: "<pt>"
    libras_token: "<libras>"
    asl_token: "<asl>"
    dgs_token: "<dgs>"

# Tokenizer configuration
tokenizer:
  name: "google/mt5-base"
  use_fast: true
  add_prefix_space: false
  
# Generation configuration
generation:
  num_beams: 5
  length_penalty: 1.0
  early_stopping: true
  no_repeat_ngram_size: 3
  max_new_tokens: 128
  temperature: 1.0
  top_k: 50
  top_p: 0.95
